<title>食物链小学堂 · The Food Chain</title>
<style>
:root{
  --bg:#fdf8f0; --bg2:#f6efe2; --card:#fffdf9; --ink:#23312b; --dim:#7d8a84;
  --accent:#2f7d5d; --accent-soft:#e7f2ec; --line:#e8e0d2; --shadow:0 10px 30px rgba(60,50,30,.10);
  --zh:1.62rem; --en:1.30rem;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121816; --bg2:#0c110f; --card:#1b2320; --ink:#e8efe9; --dim:#8d9b94;
    --accent-soft:#1e2f28; --line:#2a3531; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:radial-gradient(120% 80% at 50% 0%,var(--bg) 0%,var(--bg2) 100%);
  color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  display:flex; flex-direction:column; min-height:100dvh; overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
/* ---------- header ---------- */
header{display:flex;align-items:center;gap:.75rem;padding:1rem 1.25rem .5rem;flex:0 0 auto}
.cover{font-size:2rem;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.12))}
.titles{min-width:0}
h1{margin:0;font-size:1.12rem;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{margin:.1rem 0 0;font-size:.74rem;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.iconbtn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  width:2.4rem;height:2.4rem;display:grid;place-items:center;font-size:1rem;cursor:pointer;
  transition:transform .12s ease,background .2s;
}
.iconbtn:active{transform:scale(.92)}
/* ---------- stage ---------- */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:.5rem 1.25rem;min-height:0}
.stage{width:100%;max-width:44rem;display:flex;flex-direction:column;gap:1rem}
.chip{
  align-self:flex-start;font-size:.78rem;font-weight:600;color:var(--accent);
  background:var(--accent-soft);padding:.3rem .7rem;border-radius:999px;letter-spacing:.02em;
  transition:opacity .35s;
}
.lines{display:flex;flex-direction:column;gap:1.1rem;transition:opacity .35s ease}
.lines.fade{opacity:0}
.line-en{font-size:var(--en);line-height:1.45;font-weight:450;color:var(--ink);font-family:Georgia,"Iowan Old Style",Cambria,serif;font-style:italic}
.line-zh{font-size:var(--zh);line-height:1.6;font-weight:600;color:var(--accent);letter-spacing:.01em}
.line-en:empty,.line-zh:empty{display:none}
@media(min-width:760px){:root{--zh:2.0rem;--en:1.6rem}}
/* ---------- progress ---------- */
.prog{display:flex;flex-direction:column;gap:.4rem}
.bar{position:relative;height:.55rem;background:var(--line);border-radius:999px;cursor:pointer;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:999px;transition:width .18s linear}
.times{display:flex;justify-content:space-between;font-size:.7rem;color:var(--dim);font-variant-numeric:tabular-nums}
/* ---------- transport ---------- */
.transport{display:flex;align-items:center;justify-content:center;gap:1.1rem;flex:0 0 auto}
.play{
  width:5.4rem;height:5.4rem;border-radius:50%;border:0;cursor:pointer;
  background:var(--accent);color:#fff;font-size:2.1rem;display:grid;place-items:center;
  box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 42%,transparent);
  transition:transform .12s ease,box-shadow .2s;
}
.play:active{transform:scale(.94)}
.play.paused{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 42%,transparent)}50%{box-shadow:0 8px 34px color-mix(in srgb,var(--accent) 65%,transparent)}}
.skip{border:0;background:transparent;color:var(--dim);font-size:1.5rem;cursor:pointer;padding:.5rem;border-radius:50%;transition:color .2s,transform .12s}
.skip:active{transform:scale(.9)}
.skip:hover{color:var(--accent)}
/* ---------- controls row ---------- */
.controls{display:flex;gap:.45rem;overflow-x:auto;padding:.25rem 1.25rem calc(.9rem + env(safe-area-inset-bottom));flex:0 0 auto;scrollbar-width:none}
.controls::-webkit-scrollbar{display:none}
.toggle{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:999px;
  padding:.5rem .85rem;font-size:.82rem;cursor:pointer;display:flex;align-items:center;gap:.35rem;
  white-space:nowrap;transition:all .18s;font-family:inherit;
}
.toggle.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);font-weight:600}
.toggle:active{transform:scale(.96)}
/* ---------- transcript ---------- */
.sheet{
  position:fixed;inset:auto 0 0 0;max-height:78dvh;background:var(--card);border-radius:1.4rem 1.4rem 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.18);transform:translateY(102%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;z-index:40;
}
.sheet.open{transform:none}
.sheet header{padding:1rem 1.25rem .5rem;display:flex;align-items:center;gap:.6rem}
.sheet h2{margin:0;font-size:1rem;font-weight:700}
.grab{width:2.6rem;height:.28rem;background:var(--line);border-radius:999px;margin:.6rem auto 0}
.list{overflow-y:auto;padding:.5rem 1rem 2rem;flex:1;-webkit-overflow-scrolling:touch}
.item{padding:.7rem .85rem;border-radius:.8rem;cursor:pointer;border-left:3px solid transparent;transition:background .2s,border-color .2s}
.item+.item{margin-top:.15rem}
.item.active{background:var(--accent-soft);border-left-color:var(--accent)}
.item .n{font-size:.66rem;color:var(--dim);font-variant-numeric:tabular-nums}
.item .e{font-size:.85rem;font-family:Georgia,serif;font-style:italic;color:var(--ink);opacity:.85;margin-top:.15rem}
.item .z{font-size:.95rem;font-weight:600;color:var(--accent);margin-top:.15rem}
.item.active .e{opacity:1}
/* ---------- overlay ---------- */
.gate{
  position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;z-index:60;
  transition:opacity .4s;text-align:center;padding:2rem;
}
.gate.hide{opacity:0;pointer-events:none}
.gate .big{width:7rem;height:7rem;font-size:3rem;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 12px 36px color-mix(in srgb,var(--accent) 45%,transparent);animation:breathe 2.6s ease-in-out infinite}
.gate h3{margin:0;font-size:1.3rem;font-weight:700}
.gate p{margin:0;color:var(--dim);font-size:.88rem;max-width:24rem;line-height:1.6}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>

<script>
const MANIFEST = {"id":"food-chain","title":"食物链小学堂","titleEn":"The Food Chain","subtitle":"双语科学故事","cover":"🌿","accent":"#2f7d5d","duration":388.83,"settings":{"enVoice":"Samantha","zhVoice":"Tingting","enRate":158,"zhRate":166,"gapWithinSegment":0.6,"gapBetweenSegments":1.1,"ambience":"meadow","ambienceVolume":-20,"bedTargetDb":-18,"stingVolume":-14,"leadIn":1.4,"tailOut":2.6},"voices":{"en":"Samantha","zh":"Tingting"},"regions":[{"ambience":"meadow","start":1.4,"end":152.78},{"ambience":"forest","start":152.78,"end":181.54},{"ambience":"pond","start":181.54,"end":208.87},{"ambience":"ocean","start":208.87,"end":241.52},{"ambience":"meadow","start":241.52,"end":269.84},{"ambience":"forest","start":269.84,"end":303.74},{"ambience":"night","start":303.74,"end":360.8},{"ambience":"ocean","start":360.8,"end":378.1},{"ambience":"meadow","start":378.1,"end":388.83}],"cues":[{"i":0,"section":"① 什么是食物链？","start":1.4,"en":"In nature, every living thing has to eat to stay alive.","zh":"大自然里，每一种生物都要吃东西，才能活下去。","ambience":"meadow","sting":null,"enStart":1.4,"enEnd":4.45,"zhStart":5.05,"zhEnd":9.81,"end":10.91},{"i":1,"section":null,"start":10.91,"en":"One eats another, and another eats the next. They are linked together, like a chain.","zh":"它们一个吃一个，一个又被另一个吃，就像链条一样连在一起。","ambience":"meadow","sting":null,"enStart":10.91,"enEnd":15.78,"zhStart":16.38,"zhEnd":22.01,"end":23.11},{"i":2,"section":null,"start":23.11,"en":"That is a food chain.","zh":"这就是食物链。","ambience":"meadow","sting":"chime","enStart":23.11,"enEnd":24.23,"zhStart":24.83,"zhEnd":26.14,"end":27.24},{"i":3,"section":null,"start":27.24,"en":"And all of its energy comes from the sun.","zh":"而整条食物链的能量，都来自太阳。","ambience":"meadow","sting":null,"enStart":27.24,"enEnd":29.36,"zhStart":29.96,"zhEnd":33.37,"end":35.17},{"i":4,"section":"② 食物链的四个角色","start":35.17,"en":"Every food chain has four jobs.","zh":"每一条食物链里，都有四个角色。","ambience":"meadow","sting":"pop","enStart":35.17,"enEnd":36.99,"zhStart":37.59,"zhEnd":40.6,"end":41.7},{"i":5,"section":null,"start":41.7,"en":"First, the producers. Plants make their own food out of sunlight. They are nature's little cooks.","zh":"第一是生产者。植物用阳光自己制造养分，它们是大自然的小厨师。","ambience":"meadow","sting":null,"enStart":41.7,"enEnd":47.44,"zhStart":48.04,"zhEnd":54.46,"end":55.56},{"i":6,"section":null,"start":55.56,"en":"Grass, trees, flowers, and seaweed are all producers.","zh":"草、树、花和海藻，都是生产者。","ambience":"meadow","sting":null,"enStart":55.56,"enEnd":59.51,"zhStart":60.11,"zhEnd":63.87,"end":64.97},{"i":7,"section":null,"start":64.97,"en":"Next come the plant eaters. Animals that only eat plants are called herbivores: rabbits, caterpillars, deer, and snails.","zh":"接着是吃植物的动物。只吃植物的动物叫植食动物——兔子、毛毛虫、鹿和蜗牛。","ambience":"meadow","sting":null,"enStart":64.97,"enEnd":72.72,"zhStart":73.32,"zhEnd":80.6,"end":81.7},{"i":8,"section":null,"start":81.7,"en":"Then the meat eaters. Animals that eat other animals are called carnivores: foxes, frogs, eagles, and snakes.","zh":"然后是吃肉的动物。吃其他动物的叫肉食动物——狐狸、青蛙、老鹰和蛇。","ambience":"meadow","sting":null,"enStart":81.7,"enEnd":89.11,"zhStart":89.71,"zhEnd":96.35,"end":97.45},{"i":9,"section":null,"start":97.45,"en":"And finally, the decomposers. Mushrooms and bacteria break down dead things, and give the nutrients back to the soil, so plants can grow better.","zh":"最后是分解者。蘑菇和细菌把死掉的生物分解成养分，还给土壤，让植物长得更好。","ambience":"meadow","sting":"drip","enStart":97.45,"enEnd":106.11,"zhStart":106.71,"zhEnd":114.91,"end":116.71},{"i":10,"section":"③ 草地上的链子","start":116.71,"en":"Let us visit a grassland, where every chain begins with grass.","zh":"我们先去草原看看。在这里，每一条链子都从草开始。","ambience":"meadow","sting":null,"enStart":116.71,"enEnd":120.29,"zhStart":120.89,"zhEnd":126.4,"end":127.5},{"i":11,"section":null,"start":127.5,"en":"A grasshopper eats the grass. A frog eats the grasshopper.","zh":"蚱蜢吃草，青蛙吃蚱蜢。","ambience":"meadow","sting":null,"enStart":127.5,"enEnd":130.98,"zhStart":131.58,"zhEnd":134.17,"end":135.27},{"i":12,"section":null,"start":135.27,"en":"A snake eats the frog. And an eagle eats the snake.","zh":"蛇吃青蛙，老鹰吃蛇。","ambience":"meadow","sting":null,"enStart":135.27,"enEnd":138.24,"zhStart":138.84,"zhEnd":141.19,"end":142.29},{"i":13,"section":null,"start":142.29,"en":"The eagle stands at the very top of the chain. No animal dares to eat it.","zh":"老鹰站在食物链的最顶端，没有动物敢吃它。","ambience":"meadow","sting":null,"enStart":142.29,"enEnd":146.39,"zhStart":146.99,"zhEnd":151.28,"end":152.78},{"i":14,"section":"④ 树林里","start":152.78,"en":"Now, into the forest.","zh":"现在，我们走进树林。","ambience":"forest","sting":null,"enStart":152.78,"enEnd":154.32,"zhStart":154.92,"zhEnd":157.06,"end":158.16},{"i":15,"section":null,"start":158.16,"en":"The leaves are the producer. A caterpillar eats the leaves. A bird eats the caterpillar.","zh":"树叶是生产者，毛毛虫吃树叶，小鸟吃毛毛虫。","ambience":"forest","sting":null,"enStart":158.16,"enEnd":162.89,"zhStart":163.49,"zhEnd":168.54,"end":169.64},{"i":16,"section":null,"start":169.64,"en":"An owl eats the bird. Owls sleep during the day, and hunt at night.","zh":"猫头鹰吃小鸟。猫头鹰白天睡觉，晚上出来抓小鸟和老鼠。","ambience":"forest","sting":null,"enStart":169.64,"enEnd":173.29,"zhStart":173.89,"zhEnd":180.04,"end":181.54},{"i":17,"section":"⑤ 池塘边","start":181.54,"en":"Down to the pond.","zh":"接着，我们来到池塘边。","ambience":"pond","sting":null,"enStart":181.54,"enEnd":182.5,"zhStart":183.1,"zhEnd":185.33,"end":186.43},{"i":18,"section":null,"start":186.43,"en":"Water plants are the producer. A snail eats the water plants. A small fish eats the snail.","zh":"水草是生产者，螺蛳吃水草，小鱼吃螺蛳。","ambience":"pond","sting":null,"enStart":186.43,"enEnd":191.73,"zhStart":192.33,"zhEnd":197.09,"end":198.19},{"i":19,"section":null,"start":198.19,"en":"A duck eats the small fish. But the duck must also watch out for the fox on the shore.","zh":"鸭子吃小鱼。不过鸭子也要小心岸上的狐狸。","ambience":"pond","sting":null,"enStart":198.19,"enEnd":202.8,"zhStart":203.4,"zhEnd":207.37,"end":208.87},{"i":20,"section":"⑥ 大海里","start":208.87,"en":"And out to the open sea.","zh":"最后，我们来到大海。","ambience":"ocean","sting":null,"enStart":208.87,"enEnd":210.24,"zhStart":210.84,"zhEnd":212.95,"end":214.05},{"i":21,"section":null,"start":214.05,"en":"Seaweed is the producer. Tiny shrimp eat the seaweed. Small fish eat the shrimp. And dolphins eat the small fish.","zh":"海藻是生产者，小虾吃海藻，小鱼吃小虾，海豚吃小鱼。","ambience":"ocean","sting":null,"enStart":214.05,"enEnd":220.79,"zhStart":221.39,"zhEnd":227.72,"end":228.82},{"i":22,"section":null,"start":228.82,"en":"Dolphins are among the smartest animals in the ocean. They find fish using sound waves.","zh":"海豚是海洋里最聪明的动物之一。它用声波来寻找小鱼。","ambience":"ocean","sting":null,"enStart":228.82,"enEnd":233.76,"zhStart":234.36,"zhEnd":239.72,"end":241.52},{"i":23,"section":"⑦ 谁多谁少？金字塔","start":241.52,"en":"Here is a question for you. On a meadow, is there more grass, or more rabbits?","zh":"考考你：草地上，是草多，还是兔子多？","ambience":"meadow","sting":null,"enStart":241.52,"enEnd":246.18,"zhStart":246.78,"zhEnd":251.06,"end":252.16},{"i":24,"section":null,"start":252.16,"en":"There is the most grass, fewer rabbits, and even fewer eagles. The higher you go, the fewer there are. It looks like a pyramid.","zh":"草最多，兔子少一些，老鹰最少。越往上，数量越少，就像一个金字塔。","ambience":"meadow","sting":null,"enStart":252.16,"enEnd":259.84,"zhStart":260.44,"zhEnd":268.04,"end":269.84},{"i":25,"section":"⑧ 不止一条链：食物网","start":269.84,"en":"But a fox does not only eat rabbits. It also eats mice and birds. And a snake eats mice too, as well as frogs.","zh":"不过狐狸不只吃兔子，它也吃老鼠和小鸟。蛇也吃老鼠，还吃青蛙。","ambience":"forest","sting":null,"enStart":269.84,"enEnd":276.95,"zhStart":277.55,"zhEnd":284.42,"end":285.52},{"i":26,"section":null,"start":285.52,"en":"Many food chains cross each other, like a spider web. That is a food web. And the bigger the web, the more stable nature is.","zh":"好多条食物链交叉在一起，像一张蜘蛛网，这就是食物网。网越大，大自然就越稳定。","ambience":"forest","sting":null,"enStart":285.52,"enEnd":292.85,"zhStart":293.45,"zhEnd":301.94,"end":303.74},{"i":27,"section":"⑨ 你知道吗？","start":303.74,"en":"Did you know? All energy comes from the sun. Plants make food with sunlight, animals eat the plants, and the energy passes along.","zh":"你知道吗？所有的能量都是从太阳来的。植物用阳光制造食物，动物吃了植物，能量就传下去了。","ambience":"night","sting":"twinkle","enStart":303.74,"enEnd":311.51,"zhStart":312.11,"zhEnd":321.35,"end":322.45},{"i":28,"section":null,"start":322.45,"en":"Decomposers are nature's cleaners. Mushrooms and bacteria turn dead leaves and animals back into soil, so the grass can grow better.","zh":"分解者是大自然的清洁工。蘑菇和细菌把枯叶和死去的动物分解成养分，还给土壤，草才能长得更好。","ambience":"night","sting":null,"enStart":322.45,"enEnd":330.06,"zhStart":330.66,"zhEnd":340.59,"end":341.69},{"i":29,"section":null,"start":341.69,"en":"What if there were no wolves? There would be too many deer, the grass would be eaten bare, and other animals would lose their homes. Every animal matters.","zh":"如果没有狼，会怎么样呢？鹿会太多，草被吃光，其他动物就没有家了。所以每一个动物都很重要。","ambience":"night","sting":null,"enStart":341.69,"enEnd":349.85,"zhStart":350.45,"zhEnd":359.7,"end":360.8},{"i":30,"section":null,"start":360.8,"en":"Sharks are heroes too. They keep the ocean in balance. If the sharks disappeared, the whole ocean would fall apart.","zh":"鲨鱼也是大英雄。鲨鱼在海洋里保持生态平衡。如果鲨鱼消失了，整个海洋都会乱套。","ambience":"ocean","sting":null,"enStart":360.8,"enEnd":367.58,"zhStart":368.18,"zhEnd":377,"end":378.1},{"i":31,"section":"尾声","start":378.1,"en":"Nature is one big family. Every living thing matters.","zh":"大自然是个大家庭，每一个生命都很重要。","ambience":"meadow","sting":"chime","enStart":378.1,"enEnd":381.26,"zhStart":381.86,"zhEnd":385.73,"end":386.23}],"audio":"food-chain.m4a","ambienceAudio":"food-chain.amb.m4a","builtAt":"2026-10-09T04:41:00.722Z"};
const AUDIO_SRC = "../audio/food-chain/food-chain.m4a";
const AMB_SRC = "../audio/food-chain/food-chain.amb.m4a";

const au = document.getElementById('au');
const amb = document.getElementById('amb');
const $ = (id) => document.getElementById(id);
const cues = MANIFEST.cues || [];
const fmt = (s) => {
  if (!isFinite(s)) return '0:00';
  s = Math.max(0, s);
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
};

/* ---------- static content ---------- */
document.title = MANIFEST.title + (MANIFEST.titleEn ? ' · ' + MANIFEST.titleEn : '');
$('h1').textContent = MANIFEST.title;
$('cover').textContent = MANIFEST.cover || '📖';
$('sub').textContent = [MANIFEST.titleEn, MANIFEST.subtitle].filter(Boolean).join(' · ');
$('tTot').textContent = fmt(MANIFEST.duration);
document.documentElement.style.setProperty('--accent', MANIFEST.accent || '#2f7d5d');
$('gateTitle').textContent = MANIFEST.title;
$('gateDesc').textContent = cues.length + ' 句 · ' + fmt(MANIFEST.duration) + ' · 中英双语朗读';
au.src = AUDIO_SRC;
if (AMB_SRC) { amb.src = AMB_SRC; } else { $('tgAmb').style.display = 'none'; }

/* ---------- transcript ---------- */
const listEl = $('list');
cues.forEach((c, i) => {
  const d = document.createElement('div');
  d.className = 'item'; d.dataset.i = i;
  d.innerHTML = '<div class="n">' + (i + 1) + ' · ' + fmt(c.start) + '</div>' +
    (c.en ? '<div class="e"></div>' : '') + (c.zh ? '<div class="z"></div>' : '');
  if (c.en) d.querySelector('.e').textContent = c.en;
  if (c.zh) d.querySelector('.z').textContent = c.zh;
  d.onclick = () => { au.currentTime = c.start + 0.01; if (au.paused) play(); closeSheet(); };
  listEl.appendChild(d);
});
const items = [...listEl.children];

/* ---------- current cue tracking ---------- */
let cur = -1;
const bedLabel = (name) => {
  const map = { meadow: '🌿 草甸', forest: '🌳 树林', ocean: '🌊 海浪', pond: '💧 池塘',
    rain: '🌧️ 下雨', space: '🪐 太空', night: '🌙 夜晚' };
  return map[name] || '';
};
const regions = MANIFEST.regions || [];
const bedAt = (t) => { for (const r of regions) if (t >= r.start && t < r.end) return r.ambience; return null; };

function setCue(i, instant) {
  if (i === cur || i < 0 || i >= cues.length) return;
  cur = i;
  const c = cues[i];
  const paint = () => { $('en').textContent = c.en || ''; $('zh').textContent = c.zh || ''; };
  if (instant) { paint(); } else {
    $('lines').classList.add('fade');
    setTimeout(() => { paint(); $('lines').classList.remove('fade'); }, 180);
  }
  const chip = $('chip');
  if (c.section) { chip.textContent = c.section; chip.style.visibility = 'visible'; }
  else chip.style.visibility = 'hidden';
  items.forEach((el, k) => el.classList.toggle('active', k === i));
  updateAmbBtn();
  if (sheetOpen) {
    const el = items[i];
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

/* ---------- 氛围轨：独立开关，并与主轨保持同步 ---------- */
let ambOn = true;
function updateAmbBtn() {
  const b = bedAt(au.currentTime);
  const btn = $('tgAmb');
  if (!b || !AMB_SRC) { btn.style.display = 'none'; return; }
  btn.style.display = '';
  btn.textContent = bedLabel(b);
  btn.classList.toggle('on', ambOn);
  btn.title = ambOn ? '背景音已开启，点一下关掉' : '背景音已关掉，点一下打开';
}
/** 主轨与氛围轨同步：普通漂移不管，差得多了就对齐 */
function syncAmb(force) {
  if (!AMB_SRC) return;
  amb.playbackRate = au.playbackRate;
  if (force || Math.abs(amb.currentTime - au.currentTime) > 0.35) {
    try { amb.currentTime = au.currentTime; } catch {}
  }
}

/* ---------- transport ---------- */
const btnPlay = $('btnPlay');
function play() {
  syncAmb(true);
  au.play().catch(() => {});
  if (AMB_SRC && ambOn) amb.play().catch(() => {});
}
function pauseAll() { au.pause(); if (AMB_SRC) amb.pause(); }
function toggle() { au.paused ? play() : pauseAll(); }
function seekTo(t) {
  au.currentTime = Math.max(0, t);
  if (AMB_SRC) { try { amb.currentTime = Math.max(0, t); } catch {} }
}
btnPlay.onclick = toggle;
$('gatePlay').onclick = () => { $('gate').classList.add('hide'); play(); };
$('btnPrev').onclick = () => { const c = cues[Math.max(0, cur - 1)]; if (c) seekTo(c.start + 0.01); };
$('btnNext').onclick = () => { const c = cues[Math.min(cues.length - 1, cur + 1)]; if (c) seekTo(c.start + 0.01); };

au.addEventListener('play', () => {
  btnPlay.textContent = '❚❚'; btnPlay.classList.remove('paused');
  if (AMB_SRC && ambOn && amb.paused) { syncAmb(true); amb.play().catch(() => {}); }
});
au.addEventListener('pause', () => {
  btnPlay.textContent = '▶'; btnPlay.classList.add('paused');
  if (AMB_SRC) amb.pause();
});
au.addEventListener('ended', () => {
  if (!loop) { btnPlay.textContent = '▶'; btnPlay.classList.add('paused'); if (AMB_SRC) amb.pause(); }
});

au.addEventListener('timeupdate', () => {
  const d = au.duration || MANIFEST.duration;
  $('fill').style.width = (au.currentTime / d * 100) + '%';
  $('tCur').textContent = fmt(au.currentTime);
  // 当前句 = 最后一个 start <= t 的句子
  let i = Math.max(0, cur);
  while (i + 1 < cues.length && au.currentTime >= cues[i + 1].start) i++;
  while (i > 0 && au.currentTime < cues[i].start) i--;
  setCue(i);
  updateAmbBtn();
  syncAmb(false);
});

$('bar').onclick = (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  const d = au.duration || MANIFEST.duration;
  seekTo(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * d);
};

/* ---------- toggles ---------- */
let loop = true;
$('tgLoop').onclick = () => { loop = !loop; au.loop = loop; $('tgLoop').classList.toggle('on', loop); };
au.loop = true;

$('tgAmb').onclick = () => {
  ambOn = !ambOn;
  if (AMB_SRC) {
    if (ambOn && !au.paused) { syncAmb(true); amb.play().catch(() => {}); }
    else if (!ambOn) amb.pause();
  }
  updateAmbBtn();
};

function setRate(r) { au.playbackRate = r; if (AMB_SRC) amb.playbackRate = r; }
const speeds = [1, 1.25, 1.5, 0.75];
let si = 0;
$('tgSpeed').onclick = () => {
  si = (si + 1) % speeds.length; setRate(speeds[si]);
  $('tgSpeed').textContent = '⚡ ' + speeds[si] + '×';
  $('tgSpeed').classList.toggle('on', si > 0);
  $('tgSlow').classList.remove('on');
};
$('tgSlow').onclick = () => {
  const on = $('tgSlow').classList.toggle('on');
  setRate(on ? 0.7 : 1);
  if (on) { $('tgSpeed').textContent = '⚡ 1×'; $('tgSpeed').classList.remove('on'); si = 0; }
};

/* 睡眠定时：到点后 20 秒内缓慢淡出并暂停 */
let sleepTimer = null, fadeInt = null;
const sleepOpts = [0, 5, 10, 20, 30];
let sleepIdx = 0;
$('tgSleep').onclick = () => {
  sleepIdx = (sleepIdx + 1) % sleepOpts.length;
  const m = sleepOpts[sleepIdx];
  clearTimeout(sleepTimer); clearInterval(fadeInt); au.volume = 1; if (AMB_SRC) amb.volume = 1;
  $('tgSleep').classList.toggle('on', m > 0);
  $('tgSleep').textContent = m ? '⏰ ' + m + '分' : '⏰ 睡眠';
  if (!m) return;
  sleepTimer = setTimeout(() => {
    const t0 = Date.now();
    fadeInt = setInterval(() => {
      const k = (Date.now() - t0) / 20000;
      const v = Math.max(0, 1 - k);
      au.volume = v;
      if (AMB_SRC) amb.volume = v;
      if (k >= 1) {
        clearInterval(fadeInt); pauseAll();
        au.volume = 1; if (AMB_SRC) amb.volume = 1;
        sleepIdx = 0;
        $('tgSleep').textContent = '⏰ 睡眠'; $('tgSleep').classList.remove('on');
        $('gateDesc').textContent = '故事睡着啦，晚安 🌙';
        $('gate').classList.remove('hide');
      }
    }, 200);
  }, m * 60000);
};

/* ---------- sheet ---------- */
let sheetOpen = false;
function openSheet() { sheetOpen = true; $('sheet').classList.add('open'); $('scrim').classList.add('on'); items[cur] && items[cur].scrollIntoView({ block: 'center' }); }
function closeSheet() { sheetOpen = false; $('sheet').classList.remove('open'); $('scrim').classList.remove('on'); }
$('btnList').onclick = openSheet; $('btnClose').onclick = closeSheet; $('scrim').onclick = closeSheet;

/* ---------- keyboard ---------- */
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.code === 'ArrowRight') au.currentTime += 10;
  else if (e.code === 'ArrowLeft') au.currentTime -= 10;
  else if (e.code === 'ArrowDown') { const c = cues[Math.min(cues.length - 1, cur + 1)]; if (c) au.currentTime = c.start + 0.01; }
  else if (e.code === 'ArrowUp') { const c = cues[Math.max(0, cur - 1)]; if (c) au.currentTime = c.start + 0.01; }
  else if (e.code === 'Escape') closeSheet();
});

/* ---------- media session (锁屏控制) ---------- */
if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: MANIFEST.title, artist: MANIFEST.titleEn || '双语科学故事', album: MANIFEST.subtitle || '',
  });
  const seekTo = (d) => { const c = cues[Math.min(cues.length - 1, Math.max(0, cur + d))]; if (c) au.currentTime = c.start + 0.01; };
  navigator.mediaSession.setActionHandler('play', play);
  navigator.mediaSession.setActionHandler('pause', () => au.pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => seekTo(-1));
  navigator.mediaSession.setActionHandler('nexttrack', () => seekTo(1));
  navigator.mediaSession.setActionHandler('seekbackward', () => { au.currentTime -= 10; });
  navigator.mediaSession.setActionHandler('seekforward', () => { au.currentTime += 10; });
}

/* ---------- 初始画面 + 自动开始 ---------- */
setCue(0, true);
window.addEventListener('load', () => { play(); });
</script>
</body>
</html>
